services:
  mumble-web:
    image: mumble-web-discord:local
    build: .
    restart: unless-stopped
    environment:
      MUMBLE_SERVER: ${MUMBLE_SERVER:?Set MUMBLE_SERVER in .env}
      WEB_SIMPLE_LOGIN: ${WEB_SIMPLE_LOGIN:-true}
      WEB_ADDRESS: ${WEB_ADDRESS:-}
      WEB_PORT: ${WEB_PORT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      caddy-proxy:
        aliases:
          - mumble-web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run/mumble-web:rw,noexec,nosuid,size=1m,uid=10001,gid=10001,mode=0700
    pids_limit: 128
    mem_limit: 512m
    cpus: 2

networks:
  caddy-proxy:
    external: true
    name: ${CADDY_NETWORK:-caddy-proxy}
